name: auto-refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1-5'   # 北京时间 11:30（午盘）
    - cron: '30 7 * * 1-5'   # 北京时间 15:30（收盘后30分钟，避开整点高峰）
    - cron: '45 8 * * 1-5'   # 北京时间 16:45（收盘兜底，防止15:30的cron被GitHub延迟/丢弃）

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run pipeline
        run: python quick_refresh.py
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_dist
