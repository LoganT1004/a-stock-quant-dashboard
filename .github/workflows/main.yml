name: auto-refresh

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'deploy_dist/**'
      - 'data/**'
      - '.github/workflows/main.yml'
  schedule:
    - cron: '30 3 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '45 8 * * 1-5'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Refresh data (skip on push)
        if: github.event_name != 'push'
        run: python quick_refresh.py
        continue-on-error: true

      - name: Verify deploy_dist
        run: |
          if [ ! -f "deploy_dist/data.js" ]; then
            echo "ERROR: deploy_dist/data.js missing"
            exit 1
          fi
          head -c 200 deploy_dist/data.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_dist
          keep_files: false
